name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build cmake
          else
            brew install cmake ninja || true
          fi

      - name: Build & test
        run: ./scripts/compile.sh --clean --release --test

  loop-stability:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja || true

      - name: Run 5x test loop
        run: ./scripts/compile.sh --clean --release --loop=5

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-stability-logs
          path: build/test-logs
